services:
  - type: web
    name: fairflat-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fairflat-db
          property: connectionString
      - key: PORT
        value: 5000
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: fairflat-db
    databaseName: fairflat
    user: fairflat
